$kind: http-request
description: A removed product answers 200 with status REMOVED and its alternatives.
method: GET
url: '{{baseUrl}}/products/:slug'
pathVariables:
- key: slug
  value: '{{productSlug}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      // Never keep another product's variant ids.
      pm.collectionVariables.unset('variantId');
      pm.collectionVariables.unset('alertVariantId');
      const variants = pm.response.json().variants || [];
      const buyable = variants.find((v) => v.availability === 'IN_STOCK' || v.availability === 'LOW_STOCK');
      const waiting = variants.find((v) => v.availability === 'OUT_OF_STOCK');
      if (buyable) { pm.collectionVariables.set('variantId', buyable.id); }
      if (waiting) { pm.collectionVariables.set('alertVariantId', waiting.id); }
    }
  language: text/javascript
order: 3000
