$kind: http-request
method: GET
url: '{{baseUrl}}/products'
queryParams:
- key: q
  value: bottle
  disabled: true
  description: Search text
- key: category
  value: apparel
  disabled: true
  description: Category slug
- key: sort
  value: newest
  disabled: true
  description: popular | price_asc | price_desc | newest
- key: inStock
  value: 'true'
  disabled: true
- key: limit
  value: '20'
  disabled: true
- key: offset
  value: '0'
  disabled: true
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      const value = (json.items.find((p) => p.slug === pm.collectionVariables.get('productSlug')) || json.items[0] || {}).slug;
      if (value) { pm.collectionVariables.set('productSlug', value); }
    }
  language: text/javascript
order: 2000
