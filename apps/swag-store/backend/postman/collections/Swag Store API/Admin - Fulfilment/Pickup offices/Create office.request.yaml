$kind: http-request
description: Names are unique, so the example adds a timestamp.
method: POST
url: '{{baseUrl}}/admin/pickup-offices'
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "name": "Kandy office {{$timestamp}}",
      "address": "No. 1, Example Road, Kandy",
      "country": "Sri Lanka",
      "collectionPoint": "Reception",
      "hours": "Mon\u2013Fri 09:00\u201317:00",
      "leadTimeDays": 3,
      "hrLocations": [
        "Kandy"
      ],
      "active": true,
      "sort": 20
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      const value = json.id;
      if (value) { pm.collectionVariables.set('adminOfficeId', value); }
    }
  language: text/javascript
order: 2000
