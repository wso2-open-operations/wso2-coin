$kind: http-request
description: 'Send active: false to hide an office.'
method: PATCH
url: '{{baseUrl}}/admin/pickup-offices/:id'
headers:
- key: Content-Type
  value: application/json
pathVariables:
- key: id
  value: '{{adminOfficeId}}'
body:
  type: json
  content: |-
    {
      "hours": "Mon\u2013Thu 09:00\u201316:00",
      "active": false
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
  language: text/javascript
order: 3000
