$kind: http-request
method: POST
url: '{{baseUrl}}/admin/orders/:orderNo/notes'
headers:
- key: Content-Type
  value: application/json
pathVariables:
- key: orderNo
  value: '{{orderNo}}'
body:
  type: json
  content: |-
    {
      "note": "Shopper asked to collect on Friday."
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
  language: text/javascript
order: 6000
