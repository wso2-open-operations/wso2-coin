$kind: http-request
description: Any order, with its notes.
method: GET
url: '{{baseUrl}}/admin/orders/:orderNo'
pathVariables:
- key: orderNo
  value: '{{orderNo}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
  language: text/javascript
order: 3000
