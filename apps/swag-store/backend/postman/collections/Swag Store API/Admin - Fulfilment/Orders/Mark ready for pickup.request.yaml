$kind: http-request
description: CONFIRMED → READY_FOR_PICKUP. Emails the shopper.
method: PATCH
url: '{{baseUrl}}/admin/orders/:orderNo'
headers:
- key: Content-Type
  value: application/json
pathVariables:
- key: orderNo
  value: '{{orderNo}}'
body:
  type: json
  content: |-
    {
      "status": "READY_FOR_PICKUP",
      "note": "Shelf B2"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
  language: text/javascript
order: 4000
