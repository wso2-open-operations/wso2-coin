$kind: http-request
method: POST
url: '{{baseUrl}}/admin/orders/search'
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "filters": {
        "status": "CONFIRMED",
        "pickupOfficeId": "{{pickupOfficeId}}",
        "searchQuery": "",
        "from": "{{searchFrom}}",
        "to": "{{searchTo}}"
      },
      "pagination": {
        "limit": 50,
        "offset": 0
      }
    }
scripts:
- type: beforeRequest
  code: |-
    // The last 30 days up to tomorrow (UTC), so orders placed by this run are found.
    const day = (offset) => new Date(Date.now() + offset * 86400000).toISOString().slice(0, 10);
    pm.variables.set('searchFrom', day(-30));
    pm.variables.set('searchTo', day(1));
  language: text/javascript
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      const value = pm.collectionVariables.get('orderNo') || ((json.items || [])[0] || {}).orderNo;
      if (value) { pm.collectionVariables.set('orderNo', value); }
    }
  language: text/javascript
order: 1000
