$kind: http-request
description: Same filters, CSV rows (up to 5,000; pagination is ignored). Cells that start with = + - @ are escaped.
method: POST
url: '{{baseUrl}}/admin/orders/search'
headers:
- key: Content-Type
  value: application/json
- key: Accept
  value: text/csv
body:
  type: json
  content: |-
    {
      "filters": {
        "status": "CONFIRMED"
      }
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    pm.test('CSV body', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/csv'));
  language: text/javascript
order: 2000
