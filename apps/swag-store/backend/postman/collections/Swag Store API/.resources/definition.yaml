$kind: collection
description: 'WSO2 Swag Store backend: catalog, cart, coin checkout, office pickup, stock alerts and admin.


  The contract is openapi.yaml next to this folder. Errors are {message, errorCode}; branch on errorCode only.


  Auth: every request except Health sends x-jwt-assertion. Locally, run the store with AUTH_TOKEN_VALIDATOR_ENABLED=false and the fakes (make fakes); the collection then mints an unsigned token from userEmail, userId and userGroups. Through the Choreo gateway, the client sends its access token and the gateway adds x-jwt-assertion.


  The folders are in end-to-end order, so a full run works on a freshly seeded database: the Catalog Manager creates, publishes and stocks a product, the shopper buys it, Fulfilment Ops hands it over. Responses fill the collection variables the next requests use. Admin folders need the role groups in userGroups.'
variables:
- key: productSlug
  value: ''
  description: Set by Admin › Create product and by List products
- key: variantId
  value: ''
  description: Set by Get product (an in-stock variant)
- key: alertVariantId
  value: ''
  description: Set by Get product (an out-of-stock, restockable variant)
- key: cartLineId
  value: ''
  description: Set by Add line and Get cart
- key: walletAddress
  value: ''
  description: Set by List wallets (default wallet)
- key: pickupOfficeId
  value: ''
  description: Set by List pickup offices (the caller's default)
- key: expectedTotal
  value: '0'
  description: Set by Quote; Place order refuses a changed total
- key: orderNo
  value: ''
  description: Set by Place order and List my orders (SS-nnnnn)
- key: alertId
  value: ''
  description: Set by Create alert
- key: categoryId
  value: ''
  description: Set by Admin › List categories (an existing category for new products)
- key: newCategoryId
  value: ''
  description: Set by Admin › Create category
- key: adminProductId
  value: ''
  description: Set by Admin › Create product and List products
- key: adminVariantId
  value: ''
  description: Set by Admin › Create product and Set options
- key: adminOfficeId
  value: ''
  description: Set by Admin › Create office and List offices
auth:
  type: apikey
  credentials:
  - key: key
    value: x-jwt-assertion
  - key: value
    value: '{{jwtAssertion}}'
  - key: in
    value: header
scripts:
- type: http:beforeRequest
  code: |-
    // Local runs only: with AUTH_TOKEN_VALIDATOR_ENABLED=false the store decodes the
    // token without checking its signature. When jwtAssertion is empty and
    // mintLocalToken is "true", build an unsigned token from userEmail, userId and
    // userGroups. Against Choreo, leave mintLocalToken "false" and set jwtAssertion.
    const CryptoJS = require('crypto-js');
    const b64url = (obj) => CryptoJS.enc.Base64.stringify(CryptoJS.enc.Utf8.parse(JSON.stringify(obj)))
      .replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_');
    const given = pm.variables.get('jwtAssertion');
    if (!given && pm.variables.get('mintLocalToken') === 'true') {
      const now = Math.floor(Date.now() / 1000);
      const groups = (pm.variables.get('userGroups') || '').split(',').map((g) => g.trim()).filter(Boolean);
      const claims = {
        sub: pm.variables.get('userId'),
        email: pm.variables.get('userEmail'),
        userid: pm.variables.get('userId'),
        groups: groups,
        iat: now,
        exp: now + 3600,
      };
      // Set the variable, not the header: the collection's API-key auth fills x-jwt-assertion
      // from {{jwtAssertion}} after this script runs. A local variable lasts for the run.
      pm.variables.set('jwtAssertion', b64url({ alg: 'none', typ: 'JWT' }) + '.' + b64url(claims) + '.');
    }
  language: text/javascript
- type: http:afterResponse
  code: |-
    pm.test('No 500', () => pm.expect(pm.response.code).to.not.equal(500));
    const type = pm.response.headers.get('Content-Type') || '';
    if (pm.response.code >= 400 && type.includes('application/json')) {
      pm.test('Error body has a message', () => pm.expect(pm.response.json().message).to.be.a('string'));
    }
  language: text/javascript
