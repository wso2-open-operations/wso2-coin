$kind: http-request
description: Only for an OUT_OF_STOCK variant of a RESTOCKABLE product; otherwise 409.
method: POST
url: '{{baseUrl}}/stock-alerts'
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "variantId": "{{alertVariantId}}"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      const value = json.id;
      if (value) { pm.collectionVariables.set('alertId', value); }
    }
  language: text/javascript
order: 2000
