$kind: http-request
description: Adds a variant; merges into an existing line.
method: POST
url: '{{baseUrl}}/cart/lines'
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "variantId": "{{variantId}}",
      "quantity": 1
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      const value = json.id;
      if (value) { pm.collectionVariables.set('cartLineId', value); }
    }
  language: text/javascript
order: 1000
