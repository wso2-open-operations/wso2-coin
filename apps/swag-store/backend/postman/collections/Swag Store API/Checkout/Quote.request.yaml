$kind: http-request
description: Prices the cart for an office and wallet. Nothing is stored. canPlace is false when any line has a problem.
method: POST
url: '{{baseUrl}}/quotes'
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "pickupOfficeId": "{{pickupOfficeId}}",
      "walletAddress": "{{walletAddress}}"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      pm.test('Quote can be placed', () => pm.expect(json.canPlace, JSON.stringify(json.problems)).to.equal(true));
      pm.collectionVariables.set('expectedTotal', String(json.total));
    }
  language: text/javascript
order: 3000
