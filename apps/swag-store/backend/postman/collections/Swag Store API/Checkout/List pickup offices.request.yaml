$kind: http-request
description: Active offices and the caller's default.
method: GET
url: '{{baseUrl}}/pickup-offices'
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      const value = json.defaultOfficeId || (json.items[0] || {}).id;
      if (value) { pm.collectionVariables.set('pickupOfficeId', value); }
    }
  language: text/javascript
order: 2000
