$kind: http-request
description: For a PENDING_PAYMENT order; reuses its payment reference, so it never pays twice. A confirmed order answers 409.
method: POST
url: '{{baseUrl}}/orders/:orderNo/payments'
pathVariables:
- key: orderNo
  value: '{{orderNo}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is one of 200, 201, 202, 409', () => pm.expect(pm.response.code).to.be.oneOf([200, 201, 202, 409]));
  language: text/javascript
order: 7000
