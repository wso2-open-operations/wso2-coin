$kind: http-request
description: 201 CONFIRMED, 202 PENDING_PAYMENT (the reconciler settles it), 402 insufficient funds, 409 quote_changed. Idempotency-Key is a fresh UUID per send; fix it to a UUID to test replay.
method: POST
url: '{{baseUrl}}/orders'
headers:
- key: Content-Type
  value: application/json
- key: Idempotency-Key
  value: '{{$guid}}'
body:
  type: json
  content: |-
    {
      "pickupOfficeId": "{{pickupOfficeId}}",
      "walletAddress": "{{walletAddress}}",
      "expectedTotal": {{expectedTotal}}
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is one of 201, 202', () => pm.expect(pm.response.code).to.be.oneOf([201, 202]));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      const value = json.orderNo;
      if (value) { pm.collectionVariables.set('orderNo', value); }
    }
  language: text/javascript
order: 4000
