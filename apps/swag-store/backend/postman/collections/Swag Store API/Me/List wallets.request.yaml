$kind: http-request
description: The caller's wallets, default first. Never cached.
method: GET
url: '{{baseUrl}}/wallets'
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      const value = ((json.find((w) => w.defaultWallet) || json[0]) || {}).walletAddress;
      if (value) { pm.collectionVariables.set('walletAddress', value); }
    }
  language: text/javascript
order: 2000
