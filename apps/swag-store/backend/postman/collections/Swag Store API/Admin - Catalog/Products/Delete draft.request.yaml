$kind: http-request
description: Only a DRAFT that was never ordered (204). Anything else is 409; remove it instead.
method: DELETE
url: '{{baseUrl}}/admin/products/:id'
pathVariables:
- key: id
  value: '{{adminProductId}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is one of 204, 409', () => pm.expect(pm.response.code).to.be.oneOf([204, 409]));
  language: text/javascript
order: 11000
