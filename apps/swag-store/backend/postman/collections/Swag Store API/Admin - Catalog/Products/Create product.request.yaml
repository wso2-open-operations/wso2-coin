$kind: http-request
description: Creates a DRAFT with one default variant. Slugs are unique, so the example adds a timestamp. Photos come after, through Upload photo.
method: POST
url: '{{baseUrl}}/admin/products'
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "name": "WSO2 Water Bottle",
      "slug": "wso2-water-bottle-{{$timestamp}}",
      "description": "Steel bottle, 750 ml.",
      "categoryId": "{{categoryId}}",
      "price": 60,
      "restockPolicy": "RESTOCKABLE",
      "maxPerUser": 2,
      "limitWindowDays": 30,
      "images": [],
      "alternatives": []
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      pm.collectionVariables.set('adminProductId', json.id);
      pm.collectionVariables.set('productSlug', json.slug);
      if (json.variants && json.variants[0]) { pm.collectionVariables.set('adminVariantId', json.variants[0].id); }
    }
  language: text/javascript
order: 2000
