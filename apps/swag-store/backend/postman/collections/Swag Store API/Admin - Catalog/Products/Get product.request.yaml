$kind: http-request
description: One product with every variant and its stock.
method: GET
url: '{{baseUrl}}/admin/products/:id'
pathVariables:
- key: id
  value: '{{adminProductId}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
  language: text/javascript
order: 3000
