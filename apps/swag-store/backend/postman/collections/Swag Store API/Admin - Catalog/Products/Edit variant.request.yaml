$kind: http-request
description: Any of sku, priceDelta, active, restockEta.
method: PATCH
url: '{{baseUrl}}/admin/products/:id/variants/:variantId'
headers:
- key: Content-Type
  value: application/json
pathVariables:
- key: id
  value: '{{adminProductId}}'
- key: variantId
  value: '{{adminVariantId}}'
body:
  type: json
  content: |-
    {
      "priceDelta": 0,
      "active": true,
      "restockEta": "2026-12-15"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
  language: text/javascript
order: 6000
