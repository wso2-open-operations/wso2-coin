$kind: http-request
description: 'Status form: REMOVED → ACTIVE.'
method: PATCH
url: '{{baseUrl}}/admin/products/:id'
headers:
- key: Content-Type
  value: application/json
pathVariables:
- key: id
  value: '{{adminProductId}}'
body:
  type: json
  content: |-
    {
      "status": "ACTIVE"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
  language: text/javascript
order: 10000
