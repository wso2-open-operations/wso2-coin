$kind: http-request
description: delta > 0 for RECEIVE; any sign for ADJUST; < 0 for WRITE_OFF. Receiving stock notifies pending alerts.
method: POST
url: '{{baseUrl}}/admin/variants/:id/stock-movements'
headers:
- key: Content-Type
  value: application/json
pathVariables:
- key: id
  value: '{{adminVariantId}}'
body:
  type: json
  content: |-
    {
      "delta": 25,
      "reason": "RECEIVE",
      "note": "Supplier delivery"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
  language: text/javascript
order: 1000
