$kind: http-request
method: POST
url: '{{baseUrl}}/admin/categories'
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "slug": "drinkware-{{$timestamp}}",
      "name": "Drinkware",
      "sort": 60
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      const value = json.id;
      if (value) { pm.collectionVariables.set('newCategoryId', value); }
    }
  language: text/javascript
order: 2000
