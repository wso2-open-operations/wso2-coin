$kind: http-request
description: Only when no product points at it. Otherwise 409.
method: DELETE
url: '{{baseUrl}}/admin/categories/:id'
pathVariables:
- key: id
  value: '{{newCategoryId}}'
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
  language: text/javascript
order: 5000
