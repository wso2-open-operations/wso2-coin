$kind: http-request
method: GET
url: '{{baseUrl}}/admin/categories'
scripts:
- type: afterResponse
  code: |-
    pm.test('Status is 2xx', () => pm.expect(pm.response.code).to.be.within(200, 299));
    if (pm.response.code < 300) {
      const json = pm.response.json();
      const value = pm.collectionVariables.get('categoryId') || ((json.items || [])[0] || {}).id;
      if (value) { pm.collectionVariables.set('categoryId', value); }
    }
  language: text/javascript
order: 1000
