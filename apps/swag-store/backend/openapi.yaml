openapi: "3.0.3"
info:
  title: "Swag Store API"
  version: "1.0.0"
  description: "WSO2 Swag Store backend: catalog, cart, coin checkout, office pickup, stock alerts and admin. The Choreo gateway validates the caller's token and passes it as x-jwt-assertion. Errors are {message, errorCode}; clients branch on errorCode only."
servers:
  - url: "/"
security:
  - jwtAssertion: []
paths:
  /health:
    get:
      summary: "Liveness"
      security: []
      responses:
        "200":
          description: "The process is up"
  /health/dependencies:
    get:
      summary: "Dependency health (cached 10 s)"
      security: []
      responses:
        "200":
          description: "Every dependency is ok or not configured"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DependencyHealth"
        "503":
          description: "A dependency failed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DependencyHealth"
  /users/me:
    get:
      summary: "The signed-in user, portal roles and HR status"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
  /wallets:
    get:
      summary: "The caller's wallets, default first. Never cached"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/Wallet"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
  /categories:
    get:
      summary: "Categories with active products"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/Category"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
  /products:
    get:
      summary: "Active products"
      parameters:
        - name: "q"
          in: "query"
          schema:
            type: "string"
        - name: "category"
          in: "query"
          schema:
            type: "string"
          description: "Category slug"
        - name: "sort"
          in: "query"
          schema:
            type: "string"
            enum:
              - "popular"
              - "price_asc"
              - "price_desc"
              - "newest"
        - name: "inStock"
          in: "query"
          schema:
            type: "boolean"
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        - name: "offset"
          in: "query"
          schema:
            type: "integer"
            minimum: 0
            default: 0
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductList"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
  /products/{slug}:
    get:
      summary: "One product. A removed product answers 200 with status REMOVED and alternatives"
      parameters:
        - name: "slug"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductDetail"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
  /cart:
    get:
      summary: "The caller's cart with live prices and line states"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Cart"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
  /cart/summary:
    get:
      summary: "Item count for the top-bar badge"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CartSummary"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
  /cart/lines:
    post:
      summary: "Add a variant (merges into an existing line)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CartLineInput"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Created"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
  /cart/lines/{id}:
    patch:
      summary: "Change a line's quantity"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CartQuantity"
      responses:
        "204":
          description: "No content"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
    delete:
      summary: "Remove a line"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "204":
          description: "No content"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
  /pickup-offices:
    get:
      summary: "Active pickup offices and the caller's default"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OfficeList"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
  /quotes:
    post:
      summary: "Price the cart for an office and wallet. Nothing is stored"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Quote"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
  /orders:
    post:
      summary: "Place an order and pay with coins. Header Idempotency-Key (UUID) is required"
      parameters:
        - name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PlacedOrder"
        "202":
          description: "Payment pending; the reconciler settles it"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PlacedOrder"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
    get:
      summary: "The caller's orders, newest first"
      parameters:
        - name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        - name: "offset"
          in: "query"
          schema:
            type: "integer"
            minimum: 0
            default: 0
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrderList"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
  /orders/{orderNo}:
    get:
      summary: "One of the caller's orders"
      parameters:
        - name: "orderNo"
          in: "path"
          required: true
          schema:
            type: "string"
            pattern: "^SS-[0-9]{5,12}$"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrderDetail"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
  /orders/{orderNo}/payments:
    post:
      summary: "Retry payment for a PENDING_PAYMENT order with the same reference"
      parameters:
        - name: "orderNo"
          in: "path"
          required: true
          schema:
            type: "string"
            pattern: "^SS-[0-9]{5,12}$"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PlacedOrder"
        "401":
          "$ref": "#/components/responses/Error"
        "402":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "503":
          "$ref": "#/components/responses/Error"
  /stock-alerts:
    get:
      summary: "The caller's Notify me alerts"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AlertList"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
    post:
      summary: "Notify me when an out-of-stock, restockable variant is back"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AlertInput"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Created"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
  /stock-alerts/{id}:
    delete:
      summary: "Cancel a pending alert"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "204":
          description: "No content"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
  /admin/pickup-offices:
    get:
      summary: "Every office, with the HR location mapping"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminOfficeList"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
    post:
      summary: "Create an office"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OfficeInput"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminOffice"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
  /admin/pickup-offices/{id}:
    patch:
      summary: "Edit or deactivate an office (never deleted)"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/OfficeInput"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminOffice"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
components:
  securitySchemes:
    jwtAssertion:
      type: "apiKey"
      in: "header"
      name: "x-jwt-assertion"
  responses:
    Error:
      description: "Error"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorPayload"
  schemas:
    ErrorPayload:
      type: "object"
      properties:
        message:
          type: "string"
        errorCode:
          type: "string"
          description: "Stable snake_case code. Clients branch on this, never on message"
      required:
        - "message"
    DependencyHealth:
      type: "object"
      properties:
        database:
          type: "string"
        transactionService:
          type: "string"
        treasury:
          type: "string"
        hrEntity:
          type: "string"
        email:
          type: "string"
    Me:
      type: "object"
      properties:
        email:
          type: "string"
        firstName:
          type: "string"
        lastName:
          type: "string"
        roles:
          type: "array"
          items:
            type: "string"
            enum:
              - "catalog_manager"
              - "fulfilment_ops"
        employeeStatus:
          type: "string"
          nullable: true
      required:
        - "email"
        - "firstName"
        - "lastName"
        - "roles"
        - "employeeStatus"
    Wallet:
      type: "object"
      properties:
        walletAddress:
          type: "string"
        balance:
          type: "string"
          description: "Decimal as a string"
        defaultWallet:
          type: "boolean"
      required:
        - "walletAddress"
        - "balance"
        - "defaultWallet"
    Category:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        slug:
          type: "string"
        name:
          type: "string"
    Availability:
      type: "string"
      enum:
        - "IN_STOCK"
        - "LOW_STOCK"
        - "OUT_OF_STOCK"
        - "SOLD_OUT"
    ProductCard:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        slug:
          type: "string"
        name:
          type: "string"
        price:
          type: "integer"
          format: "int64"
        image:
          type: "string"
          nullable: true
        availability:
          "$ref": "#/components/schemas/Availability"
        status:
          type: "string"
    ProductList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/ProductCard"
        total:
          type: "integer"
          format: "int64"
      required:
        - "items"
        - "total"
    OptionValue:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        value:
          type: "string"
        swatchHex:
          type: "string"
          nullable: true
    Option:
      type: "object"
      properties:
        name:
          type: "string"
        values:
          type: "array"
          items:
            "$ref": "#/components/schemas/OptionValue"
    Variant:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        sku:
          type: "string"
        price:
          type: "integer"
          format: "int64"
        options:
          type: "string"
        optionValueIds:
          type: "array"
          items:
            type: "string"
            format: "uuid"
        availability:
          "$ref": "#/components/schemas/Availability"
        stockLeft:
          type: "integer"
          nullable: true
        restockEta:
          type: "string"
          format: "date"
          nullable: true
    Image:
      type: "object"
      properties:
        url:
          type: "string"
        alt:
          type: "string"
    ProductDetail:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        slug:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        price:
          type: "integer"
          format: "int64"
        status:
          type: "string"
          enum:
            - "ACTIVE"
            - "REMOVED"
        restockPolicy:
          type: "string"
        maxPerUser:
          type: "integer"
          nullable: true
        options:
          type: "array"
          items:
            "$ref": "#/components/schemas/Option"
        variants:
          type: "array"
          items:
            "$ref": "#/components/schemas/Variant"
        images:
          type: "array"
          items:
            "$ref": "#/components/schemas/Image"
        alternatives:
          type: "array"
          items:
            "$ref": "#/components/schemas/ProductCard"
    LineState:
      type: "string"
      enum:
        - "OK"
        - "OUT_OF_STOCK"
        - "REMOVED"
        - "LIMIT"
    CartLine:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        variantId:
          type: "string"
          format: "uuid"
        productSlug:
          type: "string"
        name:
          type: "string"
        options:
          type: "string"
        image:
          type: "string"
          nullable: true
        unitPrice:
          type: "integer"
          format: "int64"
        quantity:
          type: "integer"
          format: "int64"
        lineTotal:
          type: "integer"
          format: "int64"
        state:
          "$ref": "#/components/schemas/LineState"
        reason:
          type: "string"
          nullable: true
        availability:
          "$ref": "#/components/schemas/Availability"
    Cart:
      type: "object"
      properties:
        lines:
          type: "array"
          items:
            "$ref": "#/components/schemas/CartLine"
        itemCount:
          type: "integer"
          format: "int64"
        total:
          type: "integer"
          format: "int64"
    CartSummary:
      type: "object"
      properties:
        itemCount:
          type: "integer"
          format: "int64"
      required:
        - "itemCount"
    CartLineInput:
      type: "object"
      properties:
        variantId:
          type: "string"
          format: "uuid"
        quantity:
          type: "integer"
          minimum: 1
          maximum: 99
      required:
        - "variantId"
        - "quantity"
      additionalProperties: false
    CartQuantity:
      type: "object"
      properties:
        quantity:
          type: "integer"
          minimum: 1
          maximum: 99
      required:
        - "quantity"
      additionalProperties: false
    Created:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
    Office:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        address:
          type: "string"
        collectionPoint:
          type: "string"
        hours:
          type: "string"
        leadTimeDays:
          type: "integer"
          format: "int64"
    OfficeList:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Office"
        defaultOfficeId:
          type: "string"
          format: "uuid"
          nullable: true
    CheckoutInput:
      type: "object"
      properties:
        pickupOfficeId:
          type: "string"
          format: "uuid"
        walletAddress:
          type: "string"
        expectedTotal:
          type: "integer"
          format: "int64"
          description: "The total the shopper confirmed. A different total is 409 quote_changed"
      required:
        - "pickupOfficeId"
        - "walletAddress"
      additionalProperties: false
      description: "There is no payee field: the store always pays its pinned treasury"
    Problem:
      type: "object"
      properties:
        code:
          type: "string"
        message:
          type: "string"
    Quote:
      type: "object"
      properties:
        lines:
          type: "array"
          items:
            type: "object"
            properties:
              lineId:
                type: "string"
                format: "uuid"
              name:
                type: "string"
              options:
                type: "string"
              unitPrice:
                type: "integer"
                format: "int64"
              quantity:
                type: "integer"
                format: "int64"
              state:
                "$ref": "#/components/schemas/LineState"
              reason:
                type: "string"
                nullable: true
        total:
          type: "integer"
          format: "int64"
        pickupOffice:
          type: "object"
          properties:
            id:
              type: "string"
              format: "uuid"
            name:
              type: "string"
            leadTimeDays:
              type: "integer"
              format: "int64"
          nullable: true
        wallet:
          type: "object"
          properties:
            walletAddress:
              type: "string"
            balance:
              type: "string"
          nullable: true
        canPlace:
          type: "boolean"
        problems:
          type: "array"
          items:
            "$ref": "#/components/schemas/Problem"
    OrderStatus:
      type: "string"
      enum:
        - "PENDING_PAYMENT"
        - "CONFIRMED"
        - "FAILED"
        - "READY_FOR_PICKUP"
